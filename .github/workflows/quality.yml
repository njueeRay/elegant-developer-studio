name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    name: lint, content, build, smoke e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate content relations
        run: npm run validate:content

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://raynode.me

      - name: Generate release evidence
        run: npm run release:evidence -- --local-quality-passed
        env:
          NEXT_PUBLIC_SITE_URL: https://raynode.me

      - name: Validate release evidence
        run: npm run validate:release-evidence

      - name: Chromium smoke e2e
        run: npx playwright test --project=chromium --grep "serves|primary surfaces|command menu opens real lab route"
        env:
          NEXT_PUBLIC_SITE_URL: https://raynode.me
